name: Docker Build and Push

on:
  push:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push product-shop-client-main image 
      run: |
        docker build -t product-shop-client ./product-shop-client-main
        docker tag product-shop-client ${{ secrets.DOCKER_USERNAME }}/product-shop:client-main
        docker push ${{ secrets.DOCKER_USERNAME }}/product-shop:client-main

    - name: Build and push product-shop-server-main image
      run: |
        docker build -t product-shop-server ./product-shop-server-main
        docker tag product-shop-server ${{ secrets.DOCKER_USERNAME }}/product-shop:server-main
        docker push ${{ secrets.DOCKER_USERNAME }}/product-shop:server-main

    - name: Build and push product-shop-session-main image
      run: |
        docker build -t product-shop-session ./product-shop-session-main
        docker tag product-shop-session ${{ secrets.DOCKER_USERNAME }}/product-shop:session-main
        docker push ${{ secrets.DOCKER_USERNAME }}/product-shop:session-main

